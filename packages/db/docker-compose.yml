name: house-help

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: house-help/postgres:latest
    container_name: house-help-postgres
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_DB: house-help
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - house-help_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  house-help_postgres_data:
